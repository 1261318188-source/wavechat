services:
  - type: web
    name: wavechat
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DB_PATH
        value: /opt/render/project/src/data/wavechat.db
    disks:
      - name: wavechat-data
        mountPath: /opt/render/project/src/data
        sizeGB: 1
